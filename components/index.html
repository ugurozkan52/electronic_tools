/* Shared light/dark theme (localStorage 'et-theme'); default dark. */
(function(){var K='et-theme',r=document.documentElement,t;
try{t=localStorage.getItem(K)}catch(e){}
if(t!=='dark'&&t!=='light'){t='dark';try{localStorage.setItem(K,t)}catch(e){}}
function ap(v){r.setAttribute('data-theme',v);r.classList.toggle('dark',v==='dark')}
ap(t);
window.etTheme={get:function(){return r.getAttribute('data-theme')},set:function(v){ap(v);try{localStorage.setItem(K,v)}catch(e){}}};

<style>

<script>

let LANG = 'tr'; try { LANG = localStorage.getItem('et-lang') || ((navigator.language || '').toLowerCase().startsWith('tr') ? 'tr' : 'en'); } catch (e) { /* ignore */ }

const CMP = {}; // component registry, filled by resistor.js / capacitor.js / inductor.js / diode.js

  E6: [10, 15, 22, 33, 47, 68], E12: [10, 12, 15, 18, 22, 27, 33, 39, 47, 56, 68, 82],
  E24: [10, 11, 12, 13, 15, 16, 18, 20, 22, 24, 27, 30, 33, 36, 39, 43, 47, 51, 56, 62, 68, 75, 82, 91],
};

ESER.E48 = E96.filter((_, i) => i % 2 === 0).map((x) => x / 10); ESER.E96 = E96.map((x) => x / 10);

function nearestE(v, s) {
  const list = ESER[s], dec = Math.floor(Math.log10(v)), cands = [];
  for (let d = -1; d <= 1; d++) list.forEach((x) => cands.push(x * Math.pow(10, dec - 1 + d)));

const SEL_E = ['E6', 'E12', 'E24', 'E48', 'E96'].map((s) => [s, s, s]);
const pctF = (x) => sig(x, 3) + ' %';

/* ----------------------------------------------------------------- language */
function applyLang() {
  document.documentElement.lang = LANG;
  document.querySelectorAll('[data-tr]').forEach((e) => { e.textContent = LANG === 'tr' ? e.dataset.tr : e.dataset.en; });
  $('#lTR').setAttribute('aria-pressed', LANG === 'tr' ? 'true' : 'false'); $('#lEN').setAttribute('aria-pressed', LANG === 'en' ? 'true' : 'false');
  const C = CMP[cur];
  if (C) { $('#pageTitle').textContent = tt(...C.title); $('#pageSub').textContent = tt(...C.sub); document.title = 'Components · ' + tt(...C.name); }
  document.querySelectorAll('.part[data-comp]').forEach((b) => { b.textContent = tt(...(b.dataset.group ? PARENT_NAME[b.dataset.group] : CMP[b.dataset.comp].name)); });
  recalcAll();
}
function setLang(l) { LANG = l; try { localStorage.setItem('et-lang', l); } catch (e) { /* ignore */ } applyLang(); }

/* ----------------------------------------------------------------- "?" help */
let tipN = 0;
function qm(tr, en) {
  const id = 'tip' + (++tipN);
  return `<button type="button" class="qm" data-tip="${id}" aria-label="Info" aria-expanded="false" aria-describedby="${id}">?</button><template data-for="${id}" data-tr="${esc(tr)}" data-en="${esc(en)}"></template>`;
}
document.addEventListener('click', (e) => {
  const b = e.target.closest('.qm'); if (!b) return;
  e.preventDefault(); e.stopPropagation();

});

/* ----------------------------------------------------------------- generic forms */
// field spec: {id,tr,en,def,u:'R'|…,ud:unitIndex,help:[tr,en],sel:[[v,tr,en]…],txt:true,wide:true}
function fieldHTML(cid, f) {
  const id = `${cid}_${f.id}`, label = `<span>${I(f.tr, f.en)}${f.help ? qm(f.help[0], f.help[1]) : ''}</span>`, w = f.wide ? ' wide' : '';

  if (f.txt) return `<label class="fld${w}" for="${id}">${label}<div class="fin"><input id="${id}" value="${esc(f.def ?? '')}" autocomplete="off"></div></label>`;
  const units = f.u ? UNITS[f.u] : null, ud = f.ud ?? (units ? units.findIndex((x) => x[1] === 1) : 0);

  return `<label class="fld${w}" for="${id}">${label}<div class="fin"><input id="${id}" inputmode="decimal" value="${esc(f.def ?? '')}" autocomplete="off">${us}</div></label>`;
}
function getter(cid) {
  const el = (id) => $('#' + cid + '_' + id);
  return {
    v(id) { const e = el(id); if (!e || e.value.trim() === '') return NaN; const m = $('#' + cid + '_' + id + '_u'); return Number(e.value.replace(',', '.')) * (m ? Number(m.value) : 1); },
    r(id) { const e = el(id); return e && e.value.trim() !== '' ? Number(e.value.replace(',', '.')) : NaN; },
    s(id) { const e = el(id); return e ? e.value : ''; },
  };
}
function out(box, items) { // items: [bigText, label, cls]
  const eb = $(box); if (!eb) return;
  eb.innerHTML = items.map(([b, l, c]) => `<div class="${c || ''}"><b>${esc(b)}</b><small>${esc(l)}</small></div>`).join('');
}

/* ----------------------------------------------------------------- panes */
const TABS = [['guide', 'Parametre rehberi', 'Parameter guide'], ['tech', 'Teknolojiler / türler', 'Technologies / types'], ['wiz', 'Seçim sihirbazı', 'Selection wizard'], ['calc', 'Hesaplayıcılar', 'Calculators']];
let cur = 'resistor', curTab = 'calc';
function buildTabs() {
  const box = $('#tabs');
  TABS.forEach(([id, tr, en]) => {
    const b = document.createElement('button'); b.type = 'button'; b.className = 'tab'; b.role = 'tab'; b.dataset.id = id; b.dataset.tr = tr; b.dataset.en = en;
    b.onclick = () => showTab(id); box.appendChild(b);
  });
}
function showTab(id) {
  curTab = id;
  document.querySelectorAll('.tab').forEach((t) => t.setAttribute('aria-selected', t.dataset.id === id ? 'true' : 'false'));
  document.querySelectorAll('.pane').forEach((p) => { p.hidden = p.id !== 'p-' + id; });
  try { history.replaceState(null, '', '#' + cur + '/' + id); } catch (e) { /* ignore */ }
}
function buildParts() {
  const box = $('#parts'); box.innerHTML = '';
  const groups = {};   // components with a parent (e.g. the sensors) share one part button and get a sub-row
  Object.keys(CMP).forEach((k) => {
    const par = CMP[k].parent; if (par) { if (groups[par]) return; groups[par] = k; }
    const b = document.createElement('button'); b.type = 'button'; b.className = 'part'; b.dataset.comp = k; if (par) b.dataset.group = par; b.onclick = () => selectComp(par ? (lastChild[par] || k) : k); box.appendChild(b);
  });
}
function buildGuide(params) {
  $('#p-guide').innerHTML = `<div class="card"><h2>${I('Parametre rehberi', 'Parameter guide')}</h2><p class="sub">${I('Her parametre ne anlama gelir', 'What each parameter means')}</p>
    <input class="sel search" id="gsearch" type="search" aria-label="search">
    <div class="tbl-wrap"><table><thead><tr><th>${I('Parametre', 'Parameter')}</th><th>${I('Birim', 'Unit')}</th><th>${I('Açıklama', 'Description')}</th><th>${I('Tipik', 'Typical')}</th></tr></thead><tbody id="gbody"></tbody></table></div></div>`;
  $('#gbody').innerHTML = params.map((p) => `<tr><td>${I(p[0], p[1])}</td><td>${esc(p[2])}</td><td>${I(p[3], p[4])}</td><td>${esc(p[5])}</td></tr>`).join('');
  $('#gsearch').addEventListener('input', () => { const q = $('#gsearch').value.toLowerCase(); document.querySelectorAll('#gbody tr').forEach((r) => { r.style.display = r.textContent.toLowerCase().includes(q) ? '' : 'none'; }); });
}
function buildTech(t) { // t: {title:[tr,en], head:[[tr,en]…], rows:[[ [tr,en], cell… ]]} ; cell: string | [tr,en]
  const cell = (c) => (Array.isArray(c) ? I(c[0], c[1]) : esc(c));
  $('#p-tech').innerHTML = `<div class="card"><h2>${I(...t.title)}</h2><p class="sub">${I('Tipik değerler', 'Typical values')}</p>
    <div class="tbl-wrap"><table><thead><tr>${t.head.map((h) => `<th>${I(h[0], h[1])}</th>`).join('')}</tr></thead>
    <tbody>${t.rows.map((r) => `<tr>${r.map((c, i) => `<td>${i === 0 ? I(c[0], c[1]) : cell(c)}</td>`).join('')}</tr>`).join('')}</tbody></table></div></div>`;
}
function buildWiz(w) {
  $('#p-wiz').innerHTML = `<div class="card"><h2>${I('Seçim sihirbazı', 'Selection wizard')}</h2><p class="sub">${I('Uygulamanıza uygun türü bulun', 'Find the type that fits your application')}</p>
    <div class="grid" style="grid-template-columns:repeat(auto-fit,minmax(220px,1fr))">${w.fields.map((f) => `<label class="fld"><span>${I(f.tr, f.en)}</span><select class="sel" id="w_${f.id}">${f.opts.map(([v, a, b]) => `<option value="${esc(v)}"${String(v) === String(f.def) ? ' selected' : ''} data-tr="${esc(a)}" data-en="${esc(b)}"></option>`).join('')}</select></label>`).join('')}</div>
    <div id="w_out"></div></div>`;
}
function runWiz() {
  const w = CMP[cur].wiz; if (!w || !$('#w_out')) return;
  const v = {}; w.fields.forEach((f) => { v[f.id] = $('#w_' + f.id).value; });
  const r = w.run(v);
  $('#w_out').innerHTML = `<div class="rec"><h3>${esc(tt(...r.main))}</h3><ul>${r.why.map((x) => `<li>${esc(tt(x[0], x[1]))}</li>`).join('')}</ul><p class="note">${esc(tt('Genel kural: anma değerlerinin altında çalışın (derating) ve üretici veri sayfasındaki eğrileri kontrol edin.', 'Rule of thumb: operate below the ratings (derating) and check the curves in the manufacturer datasheet.'))}</p></div>`;
}
// worked-example table of a card: c.ex = {title, head, rows (display cells), sets (field values per row)}; a click loads the row into the fields
function exHTML(c) {
  if (!c.ex) return '';
  const cell = (x) => (Array.isArray(x) ? I(x[0], x[1]) : esc(x));
  const head = c.ex.head.map((h) => '<th>' + cell(h) + '</th>').join('');
  const rows = c.ex.rows.map((r, i) => '<tr class="exr" tabindex="0" data-ex="' + i + '" title="' + esc(tt('Değerleri karta uygula', 'Load the values into the card')) + '">' + r.map((x) => '<td>' + cell(x) + '</td>').join('') + '</tr>').join('');
  return '<details class="exw" open><summary>' + I(...c.ex.title) + '</summary><div class="tbl-wrap"><table><thead><tr>' + head + '</tr></thead><tbody>' + rows + '</tbody></table></div><p class="hint">' + I('Satıra tıklayınca değerler alanlara yazılır ve sonuçlar güncellenir.', 'Click a row to load its values into the fields and update the results.') + '</p></details>';
}
function setField(cid, id, val) {   // write a base-unit value into an input, choosing the largest unit prefix that keeps the number ≥ 1
  const e = $('#' + cid + '_' + id), u = $('#' + cid + '_' + id + '_u'); if (!e) return;
  let m = 1;
  if (u) { const opts = [...u.options].map((o) => Number(o.value)).sort((a, b) => a - b); m = opts[0]; for (const x of opts) if (Math.abs(val) >= x * 0.9995) m = x; u.value = String(m); }
  e.value = sig(val / m, 4);
}
const calcGroup = {};   // selected calculator group per component (e.g. MOSFET N / P channel)
const calcPick = {};    // selected calculator inside a group (one card at a time, keyed component|group)
function buildCalcs(calcs) {
  const groups = CMP[cur].calcGroups, sel = groups ? (calcGroup[cur] || groups[0][0]) : null;
  const inGrp = groups ? calcs.filter((c) => c.group === sel) : calcs, pick = groups ? (inGrp.some((c) => c.id === calcPick[cur + '|' + sel]) ? calcPick[cur + '|' + sel] : (inGrp[0] || {}).id) : null;
  const sub = groups ? `<div class="cpick" role="tablist" aria-label="${esc(tt('Uygulama', 'Application'))}">${inGrp.map((c) => `<button type="button" class="cp" role="tab" data-c="${c.id}" aria-selected="${c.id === pick}">${I(...c.title)}</button>`).join('')}</div>` : '';
  const head = groups ? `<div class="cgrp" role="tablist" aria-label="${esc(tt('Hesaplayıcı grubu', 'Calculator group'))}">${groups.map(([g, tr, en]) => `<button type="button" class="cg" role="tab" data-g="${g}" aria-selected="${g === sel}">${I(tr, en)}</button>`).join('')}</div>${(() => { const d = groups.find((x) => x[0] === sel); return d && d[3] ? `<p class="sub cgdesc">${I(d[3], d[4])}</p>` : ''; })()}${sub}` : '';
  $('#p-calc').innerHTML = head + `<div class="grid${groups ? ' one' : ''}">${calcs.map((c) => `<div class="card" id="c_${c.id}"${groups && c.id !== pick ? ' hidden' : ''}><h2>${I(...c.title)}</h2><p class="sub">${I(...c.sub)}</p><div class="two">${c.fields.map((f) => fieldHTML(c.id, f)).join('')}</div><div class="res" id="o_${c.id}"></div>${exHTML(c)}<div class="sch-wrap" id="s_${c.id}" hidden></div><div class="plot-wrap" id="pl_${c.id}" hidden></div><div class="simrow" id="sim_${c.id}" hidden><button type="button" class="btn primary" data-sim="${c.id}" title="${esc(tt('Bu devreyi CircuitJS simülasyonunda yeni sekmede açar', 'Opens this circuit in the CircuitJS simulation in a new tab'))}">${I('Simülasyonda aç ↗', 'Open in simulation ↗')}</button><button type="button" class="btn spice" data-spice="${c.id}" title="${esc(tt('Devreyi LTspice şematiği (.asc) olarak indirir; LTspice ile açıp Run ile çalıştırın', 'Downloads the circuit as an LTspice schematic (.asc); open it in LTspice and press Run'))}">${I('LTspice şematiği (.asc)', 'LTspice schematic (.asc)')}</button><span class="hint" id="simmsg_${c.id}"></span></div>${c.note ? `<p class="note">${I(...c.note)}</p>` : ''}</div>`).join('')}</div>`;
  if (groups) {
    $('#p-calc').querySelectorAll('.cg').forEach((b) => { b.onclick = () => { calcGroup[cur] = b.dataset.g; buildCalcs(calcs); applyLang(); recalcAll(); }; });
    $('#p-calc').querySelectorAll('.cp').forEach((b) => { b.onclick = () => { calcPick[cur + '|' + sel] = b.dataset.c; buildCalcs(calcs); applyLang(); recalcAll(); }; });
  }
}
function recalcAll() {
  const C = CMP[cur]; if (!C || !$('#p-calc').firstChild) return;
  for (const c of C.calcs) { let items; try { items = c.compute(getter(c.id)); } catch (e) { items = [['—', String(e.message || e)]]; } out("#o_" + c.id, items || [["—", ""]]);
    const sr = $('#sim_' + c.id); if (sr) sr.hidden = !SIM_MAP[cur + '.' + c.id];
    const pl = $('#pl_' + c.id); if (pl) { if (c.plot) { try { pl.replaceChildren(c.plot(getter(c.id), items)); pl.hidden = false; } catch (e) { pl.hidden = true; } } else pl.hidden = true; }
    const sf = SCH_MAP[cur + "." + c.id], sb = $("#s_" + c.id); if (sb) { if (sf) { try { sb.replaceChildren(sf(getter(c.id), items)); sb.hidden = false; } catch (e) { sb.hidden = true; } } else sb.hidden = true; } }
  runWiz();
}
const PARENT_NAME = { sensor: ['Sensör', 'Sensor'] }, lastChild = {};
function selectComp(k, keepTab) {
  cur = k; const C = CMP[k], par = C.parent; if (par) lastChild[par] = k;
  document.querySelectorAll('.part[data-comp]').forEach((b) => b.setAttribute('aria-pressed', (par ? b.dataset.group === par : b.dataset.comp === k) ? 'true' : 'false'));
  const sp = $('#subparts'); sp.hidden = !par;
  if (par) { sp.innerHTML = Object.keys(CMP).filter((x) => CMP[x].parent === par).map((x) => `<button type="button" class="part sub" role="tab" data-sub="${x}" aria-selected="${x === k}">${I(...CMP[x].name)}</button>`).join(''); sp.querySelectorAll('[data-sub]').forEach((b) => { b.onclick = () => selectComp(b.dataset.sub); }); }
  buildGuide(C.params); buildTech(C.tech); buildWiz(C.wiz); buildCalcs(C.calcs);
  applyLang(); showTab(keepTab || curTab);
}
</script>
<script src="schem.js"></script>

<script>
/* ================================================================= boot */
buildTabs(); buildParts();
$('#p-calc').addEventListener('click', (e) => {   // worked-example row → fields
  const tr = e.target.closest('tr[data-ex]'); if (!tr) return;
  const card = tr.closest('.card'), cid = card.id.slice(2), c = CMP[cur].calcs.find((x) => x.id === cid), set = c && c.ex && c.ex.sets[Number(tr.dataset.ex)];
  if (!set) return; for (const k in set) setField(cid, k, set[k]); recalcAll();
  card.querySelectorAll('tr[data-ex]').forEach((r) => r.classList.toggle('on', r === tr));
});
$('#p-calc').addEventListener('keydown', (e) => { if ((e.key === 'Enter' || e.key === ' ') && e.target.matches('tr[data-ex]')) { e.preventDefault(); e.target.click(); } });
$('#p-calc').addEventListener('click', (e) => {   // LTspice: convert the CircuitJS circuit to a SPICE netlist and download it
  const b = e.target.closest('[data-spice]'); if (!b) return;
  const id = b.dataset.spice, fn = SIM_MAP[cur + '.' + id], msg = $('#simmsg_' + id), c = CMP[cur].calcs.find((x) => x.id === id);
  const say = (t) => { msg.textContent = t; setTimeout(() => { msg.textContent = ''; }, 4000); };
  if (!fn) return;
  try { const txt = cjsToAsc(fn(getter(id)), tt(...c.title)); downloadText(cur + '-' + id + '.asc', txt); say(tt('İndirildi: LTspice’ta File → Open ile açın, Run ile çalıştırın.', 'Downloaded: open it in LTspice with File → Open and press Run.')); }
  catch (err) { say(tt('Netlist oluşturulamadı: ', 'Could not build the netlist: ') + err.message); }
});
$('#p-calc').addEventListener('click', (e) => {   // "open in simulation": build the CircuitJS text from the card's current values
  const b = e.target.closest('[data-sim]'); if (!b) return;
  const id = b.dataset.sim, fn = SIM_MAP[cur + '.' + id], msg = $('#simmsg_' + id);
  const say = (t) => { msg.textContent = t; setTimeout(() => { msg.textContent = ''; }, 3500); };
  if (!fn) return;
  if (!/^https?:$/.test(location.protocol)) { say(tt('Bu düğme sayfa bir sunucudan (http) açıldığında çalışır.', 'This button works when the page is served over http.')); return; }
  let text; try { text = fn(getter(id)); } catch (err) { say(tt('Devre oluşturulamadı: ', 'Could not build the circuit: ') + err.message); return; }
  const w = window.open('../simulation/circuitjs.html?cct=' + encodeURIComponent(text), '_blank');
  if (!w) say(tt('Yeni sekme açılamadı: açılır pencere engelini kaldırın.', 'Could not open a tab: allow pop-ups.'));
});
$('#p-calc').addEventListener('input', recalcAll); $('#p-calc').addEventListener('change', recalcAll);
$('#p-wiz').addEventListener('change', runWiz);
$('#lTR').onclick = () => setLang('tr'); $('#lEN').onclick = () => setLang('en');
(function () { const tb = $('#btnTheme'), sync = () => tb.setAttribute('aria-pressed', window.etTheme.get() === 'dark' ? 'true' : 'false'); tb.onclick = () => { window.etTheme.set(window.etTheme.get() === 'dark' ? 'light' : 'dark'); sync(); }; sync(); })();
const hp = (location.hash || '').slice(1).split('/'), hc = CMP[hp[0]] ? hp[0] : 'resistor', ht = TABS.some((t) => t[0] === hp[hp.length - 1]) ? hp[hp.length - 1] : 'calc';
selectComp(hc, ht);
</script>
